<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Portfólio de Gabriela Lopes: analista de marketing, designer gráfica e produtora publicitária. Campanhas, mídias digitais, vídeos e design para o varejo e o agro.">
<meta property="og:type" content="website">
<meta property="og:title" content="Gabriela Lopes · Portfólio">
<meta property="og:description" content="Analista de marketing, designer gráfica e produtora publicitária.">
<meta property="og:image" content="og.jpg">
<meta name="theme-color" content="#F27BB0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gabriela Lopes · Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Federant&family=Italiana&family=Outfit:wght@300;400;500;600;700&display=swap">
<style id="site-css">
/* Layout: capa em cartaz com recortes laterais em rosa, depois páginas de book em duas colunas (sobre, contato, formação, experiência) e pranchas de projetos. Visual claro único, papel creme com textura. */
:root{
  color-scheme:light;
  --paper:#F7EFE5; --surface:#FFF9F2; --ink:#1F1B3B; --muted:#6E6680; --line:#E7D8C8;
  --accent:#F27BB0; --accent-soft:#FAD3E3; --accent-deep:#D9568F; --accent-ink:#1F1B3B;
  --focus:#D9568F; --shade:rgba(31,27,59,.55); --danger:#C0284F; --ok:#2E9E6B;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --spark:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 0C53 33 67 47 100 50C67 53 53 67 50 100C47 67 33 53 0 50C33 47 47 33 50 0Z'/></svg>");
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .26  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--grain),var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;font-weight:400}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.inner{max-width:1200px;margin:0 auto}
.spark{display:inline-block;width:.62em;height:.62em;flex:none;background:var(--accent);-webkit-mask:var(--spark) center/contain no-repeat;mask:var(--spark) center/contain no-repeat}
.h-sec{font-family:var(--display);color:var(--accent);text-transform:uppercase;font-size:clamp(40px,5.4vw,64px);line-height:1;letter-spacing:.005em}
.h-sec .spark{width:.5em;height:.5em;vertical-align:.12em;margin-left:.12em}
.kicker{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep)}

/* capa */
.cover-page{position:relative;overflow:hidden;
  background:
    var(--grain),
    radial-gradient(51% 64% at 50% -2%, var(--paper) calc(100% - 1.5px), transparent 100%),
    radial-gradient(51% 64% at 50% 102%, var(--paper) calc(100% - 1.5px), transparent 100%),
    var(--accent);
  padding-block:clamp(28px,4vw,48px) clamp(20px,3vw,36px)}
.cover-page .inner{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3vw,34px);min-height:clamp(460px,46vw,640px);justify-content:space-between}
.by{font-size:clamp(15px,1.5vw,19px);font-weight:400;display:flex;gap:.4em;align-items:baseline}
.by b{font-family:var(--display);font-weight:400;font-size:1.35em;letter-spacing:.02em;text-transform:uppercase}
.title{display:grid;grid-template-columns:auto auto auto;align-items:stretch;column-gap:clamp(8px,1.4vw,20px)}
.vtag{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:500;text-transform:uppercase;color:var(--accent);font-size:clamp(12px,3.1vw,44px);letter-spacing:.02em;line-height:1;text-align:center;white-space:nowrap;overflow:hidden;max-height:100%}
.big{font-family:var(--display);color:var(--accent);font-size:clamp(72px,21vw,262px);line-height:.88;text-transform:uppercase;display:grid;grid-template-columns:auto;letter-spacing:.005em}
.big span:nth-child(even){text-align:left}
.cover-foot{width:100%;display:flex;align-items:center;gap:clamp(14px,3vw,40px)}
.badges{display:flex;gap:6px;flex:none}
.badge{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.badge .spark{background:var(--ink);width:14px;height:14px}
.cover-foot hr{flex:1;border:0;border-top:2px solid var(--ink);margin:0;min-width:24px}
.cover-foot small{font-size:12.5px;white-space:nowrap}
@media (max-width:560px){.cover-foot small{white-space:normal;max-width:16ch;text-align:right}}

/* faixa animada */
.ticker{background:var(--grain),var(--accent);color:var(--accent-ink);overflow:hidden;border-block:2px solid var(--ink)}
.ticker-track{display:flex;width:max-content;animation:tick 38s linear infinite;padding-block:14px}
.ticker-track > span{font-family:var(--display);font-size:clamp(22px,2.6vw,34px);line-height:1.1;text-transform:uppercase;white-space:nowrap;padding-inline:20px;display:flex;align-items:center;gap:40px}
.ticker-track > span::after{content:"";width:.6em;height:.6em;background:var(--ink);-webkit-mask:var(--spark) center/contain no-repeat;mask:var(--spark) center/contain no-repeat}
@keyframes tick{to{transform:translateX(-50%)}}

/* faixa rasgada com foto recortada */
.tear-sec{position:relative;overflow:hidden;padding-top:calc(clamp(260px,40vw,520px) * .97 - clamp(170px,22vw,300px) + 24px)}
.tear-wrap{position:relative;height:clamp(170px,22vw,300px)}
.tear-fiber{position:absolute;inset:-9px 0;background:#FFFDF8;clip-path:polygon(0.0% 2.23%,1.92% 3.32%,3.85% 2.87%,5.77% 7.07%,7.69% 7.66%,9.62% 1.21%,11.54% 1.41%,13.46% 1.86%,15.38% 1.87%,17.31% 3.88%,19.23% 4.71%,21.15% 2.1%,23.08% 0.03%,25.0% 3.35%,26.92% 2.95%,28.85% 4.53%,30.77% 7.62%,32.69% 5.52%,34.62% 4.12%,36.54% 4.94%,38.46% 5.41%,40.38% 0.43%,42.31% 7.2%,44.23% 6.24%,46.15% 7.0%,48.08% 6.38%,50.0% 3.14%,51.92% 3.19%,53.85% 0.83%,55.77% 5.07%,57.69% 0.5%,59.62% 0.54%,61.54% 1.67%,63.46% 1.3%,65.38% 2.72%,67.31% 0.42%,69.23% 0.0%,71.15% 1.21%,73.08% 0.81%,75.0% 2.91%,76.92% 0.2%,78.85% 6.99%,80.77% 4.91%,82.69% 1.19%,84.62% 2.02%,86.54% 2.78%,88.46% 2.91%,90.38% 0.98%,92.31% 6.79%,94.23% 7.94%,96.15% 3.73%,98.08% 3.87%,100.0% 0.69%,100.0% 92.82%,98.08% 94.74%,96.15% 94.12%,94.23% 98.63%,92.31% 93.29%,90.38% 92.18%,88.46% 99.61%,86.54% 96.23%,84.62% 93.17%,82.69% 96.35%,80.77% 92.22%,78.85% 96.22%,76.92% 99.83%,75.0% 98.91%,73.08% 97.57%,71.15% 94.09%,69.23% 94.93%,67.31% 93.34%,65.38% 98.18%,63.46% 96.26%,61.54% 98.23%,59.62% 94.64%,57.69% 93.78%,55.77% 98.49%,53.85% 99.88%,51.92% 98.82%,50.0% 98.45%,48.08% 98.55%,46.15% 97.92%,44.23% 93.81%,42.31% 96.14%,40.38% 94.84%,38.46% 92.23%,36.54% 92.22%,34.62% 94.24%,32.69% 94.07%,30.77% 97.54%,28.85% 99.65%,26.92% 95.58%,25.0% 99.5%,23.08% 99.9%,21.15% 99.64%,19.23% 94.92%,17.31% 93.76%,15.38% 93.81%,13.46% 93.57%,11.54% 93.63%,9.62% 96.99%,7.69% 99.2%,5.77% 98.72%,3.85% 95.84%,1.92% 97.22%,0.0% 98.4%)}
.tear{position:absolute;inset:0;background:var(--grain),var(--ink);clip-path:polygon(0.0% 1.94%,2.17% 0.91%,4.35% 3.91%,6.52% 0.43%,8.7% 3.22%,10.87% 2.19%,13.04% 0.35%,15.22% 3.04%,17.39% 0.22%,19.57% 2.6%,21.74% 0.42%,23.91% 0.54%,26.09% 2.55%,28.26% 4.96%,30.43% 0.74%,32.61% 1.34%,34.78% 3.76%,36.96% 5.69%,39.13% 3.46%,41.3% 2.38%,43.48% 5.86%,45.65% 0.28%,47.83% 5.15%,50.0% 1.74%,52.17% 0.87%,54.35% 0.71%,56.52% 1.85%,58.7% 4.9%,60.87% 1.08%,63.04% 3.49%,65.22% 3.83%,67.39% 2.23%,69.57% 3.29%,71.74% 0.38%,73.91% 0.36%,76.09% 1.24%,78.26% 4.08%,80.43% 2.57%,82.61% 1.88%,84.78% 3.51%,86.96% 2.72%,89.13% 1.8%,91.3% 4.77%,93.48% 4.19%,95.65% 1.46%,97.83% 3.45%,100.0% 3.15%,100.0% 99.25%,97.83% 98.38%,95.65% 95.73%,93.48% 99.88%,91.3% 94.71%,89.13% 96.51%,86.96% 98.54%,84.78% 94.91%,82.61% 96.93%,80.43% 94.24%,78.26% 98.01%,76.09% 98.59%,73.91% 97.44%,71.74% 99.25%,69.57% 95.88%,67.39% 98.17%,65.22% 97.57%,63.04% 97.48%,60.87% 96.74%,58.7% 99.04%,56.52% 99.67%,54.35% 96.84%,52.17% 97.98%,50.0% 94.36%,47.83% 98.21%,45.65% 97.88%,43.48% 99.96%,41.3% 98.93%,39.13% 95.71%,36.96% 96.31%,34.78% 98.01%,32.61% 94.14%,30.43% 96.77%,28.26% 95.01%,26.09% 94.7%,23.91% 94.35%,21.74% 98.61%,19.57% 94.78%,17.39% 95.49%,15.22% 96.35%,13.04% 99.23%,10.87% 94.48%,8.7% 96.7%,6.52% 97.3%,4.35% 99.3%,2.17% 98.92%,0.0% 99.18%);display:flex;align-items:center;overflow:hidden}
.tear-run{display:flex;width:max-content;animation:tick 34s linear infinite}
.tear-run > span{font-family:var(--display);font-size:clamp(84px,14vw,200px);line-height:1;text-transform:uppercase;white-space:nowrap;color:var(--paper);display:flex;align-items:center;gap:.22em;padding-right:.22em}
.tear-run > span.o{color:transparent;-webkit-text-stroke:2px var(--accent)}
.tear-run .spark{width:.34em;height:.34em;background:var(--accent)}
.tear-photo{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:clamp(260px,40vw,520px);max-width:none;z-index:3;filter:drop-shadow(0 16px 28px rgba(31,27,59,.35))}
.tear-cover{position:absolute;left:0;right:0;bottom:-2px;height:clamp(26px,3vw,40px);z-index:4;pointer-events:none}
.tear-cover i{position:absolute;inset:0}
.tear-cover .cf{background:#FFFDF8;clip-path:polygon(0.0% 3.22%,1.85% 25.1%,3.7% 34.57%,5.56% 29.73%,7.41% 28.51%,9.26% 18.17%,11.11% 6.78%,12.96% 29.99%,14.81% 12.64%,16.67% 30.43%,18.52% 36.92%,20.37% 15.04%,22.22% 15.25%,24.07% 35.98%,25.93% 27.54%,27.78% 6.46%,29.63% 4.83%,31.48% 5.74%,33.33% 34.38%,35.19% 30.65%,37.04% 5.55%,38.89% 31.41%,40.74% 37.25%,42.59% 24.98%,44.44% 13.32%,46.3% 20.85%,48.15% 4.98%,50.0% 0.54%,51.85% 36.89%,53.7% 24.69%,55.56% 20.01%,57.41% 35.48%,59.26% 16.48%,61.11% 33.13%,62.96% 31.39%,64.81% 8.02%,66.67% 9.57%,68.52% 11.13%,70.37% 9.14%,72.22% 22.28%,74.07% 9.86%,75.93% 15.92%,77.78% 4.98%,79.63% 34.58%,81.48% 13.44%,83.33% 17.41%,85.19% 22.17%,87.04% 34.36%,88.89% 15.98%,90.74% 34.87%,92.59% 19.06%,94.44% 20.21%,96.3% 19.89%,98.15% 0.71%,100.0% 16.72%,100% 100%,0% 100%)}
.tear-cover .cp{background:var(--grain),var(--paper);clip-path:polygon(0.0% 35.86%,2.08% 30.13%,4.17% 55.57%,6.25% 35.52%,8.33% 45.15%,10.42% 53.21%,12.5% 47.81%,14.58% 40.43%,16.67% 46.59%,18.75% 47.77%,20.83% 55.1%,22.92% 33.4%,25.0% 47.93%,27.08% 37.95%,29.17% 38.86%,31.25% 54.71%,33.33% 46.25%,35.42% 47.98%,37.5% 54.32%,39.58% 59.2%,41.67% 44.18%,43.75% 49.6%,45.83% 46.18%,47.92% 46.39%,50.0% 52.17%,52.08% 44.48%,54.17% 47.07%,56.25% 45.3%,58.33% 60.13%,60.42% 52.37%,62.5% 58.05%,64.58% 60.15%,66.67% 38.31%,68.75% 47.9%,70.83% 60.18%,72.92% 56.88%,75.0% 34.39%,77.08% 33.89%,79.17% 44.15%,81.25% 32.32%,83.33% 37.7%,85.42% 32.34%,87.5% 51.42%,89.58% 55.09%,91.67% 58.7%,93.75% 34.94%,95.83% 52.92%,97.92% 51.13%,100.0% 34.58%,100% 100%,0% 100%)}

/* páginas do book */
.page{padding-block:clamp(56px,8vw,104px)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:clamp(36px,6vw,88px);align-items:start}
@media (max-width:800px){.cols{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:clamp(44px,6vw,72px);min-width:0}
.blk{display:flex;flex-direction:column;gap:22px;min-width:0}

/* sobre */
.photo{position:relative;width:min(100%,460px);aspect-ratio:1/1;max-width:100%}
.photo::before,.photo::after{content:"";position:absolute;background:var(--accent);border-radius:clamp(28px,4vw,48px)}
.photo::before{left:14%;right:0;top:0;bottom:22%}
.photo::after{left:0;right:30%;top:70%;bottom:0}
.photo .pic{position:absolute;z-index:1;left:7%;right:7%;top:6%;bottom:6%;border-radius:clamp(22px,3vw,38px);overflow:hidden;background:var(--accent-soft);display:grid;place-items:center}
.photo .pic img{width:100%;height:100%;object-fit:cover;display:block}
.photo .mono{font-family:var(--display);font-size:clamp(110px,15vw,190px);line-height:1;color:var(--ink);letter-spacing:.01em}
.about-top{display:flex;flex-direction:column;gap:16px}
.inner.about-solo{max-width:860px}
.about-role{font-size:clamp(19px,1.9vw,23px);font-weight:600;line-height:1.3;color:var(--accent-deep);max-width:34ch;margin-top:-6px}
.about-top > .spark{font-size:56px}
.bio{font-size:clamp(18px,1.7vw,21px);font-weight:300;line-height:1.5;white-space:pre-line;max-width:58ch}
.rule{border:0;border-top:2px solid var(--accent);margin:8px 0 0;width:100%}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14.5px}
.fact b{font-weight:700;color:var(--accent-deep)}

/* contato */
.c-list{display:flex;flex-direction:column;gap:16px;margin:0;padding:0;list-style:none}
.c-row{display:flex;align-items:center;gap:16px;min-width:0}
.c-ico{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none;font-weight:700;font-size:15px}
.c-ico svg{width:22px;height:22px}
.c-val{font-size:clamp(17px,1.6vw,20px);font-weight:300;overflow-wrap:anywhere;min-width:0}
.c-val a{text-decoration:none}
.c-val a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
.c-copy{margin-left:auto;flex:none;background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500}
.c-copy:hover{background:var(--ink);color:var(--paper)}
.hint{color:var(--muted);font-size:15px;border:1.5px dashed var(--line);border-radius:12px;padding:14px 16px}

/* formação e experiência */
.edu{display:flex;flex-direction:column;gap:22px}
.edu-item{display:flex;flex-direction:column;gap:2px}
.edu-item .kicker{margin-bottom:4px}
.edu-course{font-weight:600;font-size:clamp(18px,1.7vw,21px);line-height:1.3}
.edu-inst{font-weight:300;font-size:clamp(17px,1.6vw,20px);color:var(--ink)}
.exp{display:flex;flex-direction:column;gap:24px}
.exp-item{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:4px 22px}
.exp-role{font-weight:600;text-align:right;line-height:1.2;font-size:17px}
.exp-role small{display:block;font-weight:400;color:var(--muted);font-size:13.5px;margin-top:4px}
.exp-co{font-weight:600;font-size:clamp(18px,1.7vw,21px);line-height:1.3}
.exp-desc{font-weight:300;white-space:pre-line;margin-top:4px}
@media (max-width:520px){.exp-item{grid-template-columns:1fr}.exp-role{text-align:left}}

/* habilidades */
.sk-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0;padding:0;list-style:none}
.sk-list li{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:400;min-width:0}
.sk-list li .spark{font-size:18px}
.areas{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.areas li{border:1.5px solid var(--ink);border-radius:999px;padding:7px 16px;font-weight:500;font-size:15.5px}
@media (max-width:420px){.sk-list{grid-template-columns:1fr}}

.inner.rows{display:flex;flex-direction:column;gap:clamp(56px,7vw,96px)}
.row-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:clamp(20px,3vw,32px);border-bottom:2px solid var(--accent)}
.xp-list{display:flex;flex-direction:column}
.xp{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.7fr);gap:8px clamp(24px,3.5vw,48px);padding-block:24px;border-bottom:1px solid var(--line);align-items:start}
.xp:first-child{padding-top:4px}
.xp-when{white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);padding-top:6px}
.xp-co{font-family:var(--body);font-weight:600;font-size:clamp(20px,1.9vw,24px);line-height:1.25;letter-spacing:0}
.xp-role{font-weight:400;color:var(--muted);margin-top:4px}
.xp-desc{font-weight:300;white-space:pre-line;max-width:62ch}
@media (max-width:860px){.xp{grid-template-columns:1fr;gap:6px}.xp-when{padding-top:0}.xp-desc{margin-top:6px}}
.edu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:24px 20px}
.edu-card{display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--ink);padding-top:14px;min-width:0}
.edu-card .kicker{margin-bottom:4px}
.edu-card .edu-course{font-size:clamp(18px,1.6vw,20px)}
.edu-card .edu-inst{font-size:17px}
.edu-note{font-size:14px;color:var(--muted)}
.sk-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px clamp(32px,5vw,72px);align-items:start}
.sk-h{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:16px}
@media (max-width:760px){.sk-grid{grid-template-columns:1fr}}
.c-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px 32px}
.c-grid .c-row{padding:14px 0;border-bottom:1px solid var(--line)}
.c-val{display:flex;flex-direction:column;gap:2px}

<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var DRAFT_KEY = 'gl-portfolio-draft';

var COLORS = {
  pink:{bg:'#F27BB0',fg:'#1F1B3B',name:'Rosa'},
  blush:{bg:'#FAD3E3',fg:'#1F1B3B',name:'Rosa claro'},
  rose:{bg:'#D9568F',fg:'#FFF6EE',name:'Rosa escuro'},
  ink:{bg:'#1F1B3B',fg:'#F7EFE5',name:'Grafite'},
  sand:{bg:'#E8D6C1',fg:'#1F1B3B',name:'Areia'},
  peach:{bg:'#FFB89A',fg:'#1F1B3B',name:'Pêssego'}
};
var LEVELS = ['Técnico','Curso livre','Graduação','Pós-graduação','MBA','Mestrado'];

// o conteúdo vem da API; até chegar, a página mostra um aviso de carregamento
function normalize(d){
  d = d || {};
  d.profile = d.profile || {};
  ['education','experience','projects','tools','areas','contacts'].forEach(function(k){ d[k] = d[k] || []; });
  d.contactTitle = d.contactTitle || '';
  d.projects.forEach(function(p){ p.gallery = p.gallery || []; });
  return d;
}
var DATA = normalize({});
var state = {
  draft: null,          // cópia em edição (null = sem edição)
  adminOpen: false,
  previewing: false,
  tab: 'perfil',
  canEdit: false,
  readOnly: false,
  filter: 'Todos',
  openProject: null,
  status: null,
  armed: null,
  loading: true,
  loadError: false,
  loginOpen: false,
  loginError: '',
  me: null
};

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function same(a,b){ return JSON.stringify(a) === JSON.stringify(b); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(p){ return p + Math.random().toString(36).slice(2,8); }
function imgSrc(v){ v = String(v || ''); if(v.indexOf('/uploads/') === 0) return v.slice(1); return /^https?:\/\//.test(v) ? v : ''; }
function isVid(v){ return /\.(mp4|webm)(?:[?#]|$)/i.test(String(v || '')); }
function safeUrl(u){ u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
function hashNum(s){ var h = 0; for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h; }
function view(){ return state.draft || DATA; }
function dirty(){ return !!state.draft && !same(state.draft, DATA); }

function ss(fn){ try { return fn(window.sessionStorage); } catch(e){ return null; } }
function saveDraftLocal(){ ss(function(s){ if(state.draft && dirty()) s.setItem(DRAFT_KEY, JSON.stringify(state.draft)); else s.removeItem(DRAFT_KEY); }); }

// chamadas à API: devolve o JSON ou rejeita com {status, code, message}
function api(method, url, body){
  var opts = { method: method, credentials: 'same-origin', headers: {} };
  if(body instanceof FormData) opts.body = body;
  else if(body !== undefined){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetch(url, opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(r.ok) return j;
      var e = (j && j.error) || {}; e.status = r.status; e.code = e.code || 'server_error';
      e.message = e.message || 'Não foi possível falar com o servidor. Tente de novo.';
      throw e;
    });
  }, function(){ throw { status: 0, code: 'offline', message: 'Sem conexão com o servidor. Confira a internet e tente de novo.' }; });
}

/* ---------- site ---------- */
var SPARK = '<span class="spark" aria-hidden="true"></span>';
var ICONS = {
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>',
  insta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3.5h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 6.8 6.8l1.4-2.2 4.3 1.7V19a1.5 1.5 0 0 1-1.6 1.5C10.6 20 4 13.4 3.5 5.1A1.5 1.5 0 0 1 5 3.5Z"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>'
};
function contactIcon(label){
  var l = (label || '').toLowerCase();
  if(l.indexOf('mail') > -1) return ICONS.mail;
  if(l.indexOf('insta') > -1) return ICONS.insta;
  if(l.indexOf('whats') > -1 || l.indexOf('tel') > -1 || l.indexOf('fone') > -1 || l.indexOf('cel') > -1) return ICONS.phone;

function shade(hex, t){
  var n = parseInt(String(hex).slice(1), 16);
  if(isNaN(n)) return hex;
  var f = function(v){ return Math.round(v * (1 - t)); };
  return 'rgb(' + f(n >> 16 & 255) + ',' + f(n >> 8 & 255) + ',' + f(n & 255) + ')';
}

function render(){
  if(state.loading || state.loadError){
    app.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-size:17px;color:var(--muted)">' +
      (state.loadError ? 'Não foi possível carregar o portfólio. Recarregue a página em instantes.' : 'Carregando portfólio…') + '</div>';
    return;
  }
  var scroll = null, body = document.getElementById('adm-body');
  if(body) scroll = body.scrollTop;
  var focusId = document.activeElement && document.activeElement.id;
  var html = renderSite();
  if(state.adminOpen && state.draft && !state.previewing) html += renderAdmin();
  if(state.loginOpen) html += renderLogin();
  if(state.toast) html += '<div class="toast" role="status">' + esc(state.toast) + '</div>';
  app.innerHTML = html;
  document.body.style.overflow = (state.adminOpen && !state.previewing) || state.openProject || state.loginOpen ? 'hidden' : '';
  body = document.getElementById('adm-body');
  if(body && scroll != null) body.scrollTop = scroll;
  if(focusId){ var f = document.getElementById(focusId); if(f) f.focus(); }
}
var siteTimer = null;
function softUpdate(){
  // atualiza só o status do painel enquanto se digita, sem perder o foco
  var st = document.getElementById('adm-status');
  if(st) st.innerHTML = statusChip();
  var bar = document.querySelector('.adm-bar');
  if(bar){
    bar.querySelector('[data-act="publish"]').disabled = !dirty() || state.readOnly;
    bar.querySelector('[data-act="discard"]').disabled = !dirty();
  }
  clearTimeout(siteTimer);
  siteTimer = setTimeout(saveDraftLocal, 400);
}
function toast(t){ state.toast = t; render(); clearTimeout(toast.t); toast.t = setTimeout(function(){ state.toast = null; render(); }, 2600); }

function openAdmin(){

  if(!state.draft) state.draft = clone(DATA);
  state.adminOpen = true; state.previewing = false; state.openProject = null;

}
function closeAdmin(){
  state.adminOpen = false; state.previewing = false; state.armed = null;

function findList(name){ return state.draft[name]; }
function move(arr, i, j){ if(j < 0 || j >= arr.length) return; var x = arr.splice(i,1)[0]; arr.splice(j,0,x); }

/* ---------- eventos ---------- */
app.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act],[data-filter],[data-project],[data-tab],[data-copy]');
  if(!t) return;
  if(t.hasAttribute('data-filter')){ state.filter = t.getAttribute('data-filter'); render(); return; }
  if(t.hasAttribute('data-project')){ state.openProject = t.getAttribute('data-project'); render(); var c = app.querySelector('.close'); if(c) c.focus(); return; }
  if(t.hasAttribute('data-tab')){ state.tab = t.getAttribute('data-tab'); state.armed = null; render(); var b = document.getElementById('adm-body'); if(b) b.scrollTop = 0; return; }
  if(t.hasAttribute('data-copy')){ copy(t.getAttribute('data-copy'), t); return; }
  var act = t.getAttribute('data-act');
  if(act === 'close-project'){ if(ev.target === t || t.classList.contains('close')){ var id = state.openProject; state.openProject = null; render(); var back = app.querySelector('[data-project="' + id + '"]'); if(back) back.focus(); } return; }
  if(act === 'open-admin'){ openAdmin(); return; }
  if(act === 'close-login'){ state.loginOpen = false; if(location.pathname === '/admin') history.replaceState(null, '', '/'); render(); return; }
  if(act === 'logout'){
    api('POST', '/api/auth/logout').catch(function(){}).then(function(){ state.canEdit = false; state.me = null; closeAdmin(); toast('Você saiu do painel'); });
    return;
  }
  if(act === 'close-admin'){ closeAdmin(); return; }
  if(act === 'preview'){ state.previewing = true; render(); window.scrollTo(0,0); return; }
  if(act === 'back-admin'){ state.previewing = false; render(); return; }
  if(act === 'publish'){ publish(); return; }
  if(act === 'discard'){
    if(state.armed !== 'discard'){ state.armed = 'discard'; render(); return; }
    state.draft = clone(DATA); state.armed = null; state.recovered = false; state.status = null; saveDraftLocal(); render(); toast('Alterações descartadas'); return;
  }
  if(act === 'gal-up' || act === 'gal-remove'){
    var gp = state.draft.projects.filter(function(x){ return x.id === t.getAttribute('data-pid'); })[0], gi = +t.getAttribute('data-idx');
    if(gp){ if(act === 'gal-up') move(gp.gallery, gi, gi - 1); else gp.gallery.splice(gi, 1); render(); softUpdate(); }
    return;
  }
  var list = t.getAttribute('data-list'), id = t.getAttribute('data-id');
  if(act === 'add'){
    var item;
    if(list === 'education') item = {id:uid('e'),level:'Curso livre',course:'',institution:'',period:'',notes:''};
    if(list === 'projects') item = {id:uid('p'),title:'',category:'',year:String(new Date().getFullYear()),client:'',formats:'',description:'',color:Object.keys(COLORS)[state.draft.projects.length % 6],coverColor:['#F27BB0','#EE7A30','#2747A8','#2E9E4F','#C8262E','#7A5AE0'][state.draft.projects.length % 6],coverAccent:'',coverTitle:'',coverFocus:'',image:'',link:'',example:false};
    if(list === 'contacts') item = {id:uid('c'),label:'',value:'',url:''};
    if(list === 'experience') item = {id:uid('x'),company:'',role:'',period:'',description:''};
    findList(list).push(item); render();
    var first = document.querySelector('[data-id="' + item.id + '"][data-field]');
    if(first){ first.focus(); first.scrollIntoView({block:'center'}); }
    softUpdate(); return;
  }
  if(act === 'up' || act === 'down'){
    var arr = findList(list), i = arr.findIndex(function(x){ return x.id === id; });
    move(arr, i, act === 'up' ? i - 1 : i + 1); state.armed = null; render(); softUpdate(); return;
  }
  if(act === 'remove'){
    var key = list + ':' + id;
    if(state.armed !== key){ state.armed = key; render(); return; }
    state.draft[list] = findList(list).filter(function(x){ return x.id !== id; });
    state.armed = null; render(); softUpdate(); toast('Item removido. Publique para aplicar no site.'); return;
  }
  var sl = t.getAttribute('data-strlist'), idx = +t.getAttribute('data-idx');
  if(act === 'str-add'){ state.draft[sl].push(''); render(); var inp = document.getElementById('sk-' + sl + '-' + (state.draft[sl].length - 1)); if(inp) inp.focus(); softUpdate(); return; }
  if(act === 'str-up'){ move(state.draft[sl], idx, idx - 1); render(); softUpdate(); return; }
  if(act === 'str-remove'){ state.draft[sl].splice(idx, 1); render(); softUpdate(); return; }
  if(act === 'clear-image'){ setImage(t.getAttribute('data-image'), ''); render(); softUpdate(); return; }
});

app.addEventListener('input', function(ev){
  var el = ev.target;
  if(!state.draft || el.type === 'file') return;
  var val = el.type === 'checkbox' ? el.checked : el.value;
  if(el.hasAttribute('data-obj')){
    var o = el.getAttribute('data-obj') === 'root' ? state.draft : state.draft[el.getAttribute('data-obj')];
    o[el.getAttribute('data-field')] = val;
  } else if(el.hasAttribute('data-list')){
    var it = state.draft[el.getAttribute('data-list')].filter(function(x){ return x.id === el.getAttribute('data-id'); })[0];
    if(!it) return;
    var f = el.getAttribute('data-field');
    if(f === 'coverModeImage'){ it.coverMode = val ? 'image' : ''; f = 'coverMode'; }
    else it[f] = val;
    // editar um projeto de exemplo tira a etiqueta "Exemplo"
    if(el.getAttribute('data-list') === 'projects' && f !== 'example' && f !== 'color' && it.example){
      it.example = false; var cb = document.getElementById('pj-ex-' + it.id); if(cb) cb.checked = false;
    }
    if(f === 'title' || f === 'course' || f === 'label' || f === 'company'){ var head = el.closest('.item').querySelector('.item-head strong'); if(head) head.textContent = val || 'Sem nome'; }
  } else if(el.hasAttribute('data-strlist')){
    state.draft[el.getAttribute('data-strlist')][+el.getAttribute('data-idx')] = val;
  } else return;
  softUpdate();
});
app.addEventListener('change', function(ev){

document.addEventListener('keydown', function(ev){

function copy(text, btn){
  function done(){ btn.textContent = 'Copiado'; setTimeout(function(){ btn.textContent = 'Copiar'; }, 1600); }
  function fallback(){ var v = btn.closest('.c-item').querySelector('.c-val'); var r = document.createRange(); r.selectNodeContents(v); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selecionado'; }
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
}

/* ---------- imagens ---------- */
function setImage(target, value){
  if(target === 'profile'){ state.draft.profile.photo = value; return; }
  if(target === 'profileCut'){ state.draft.profile.photoCut = value; return; }
  var id = target.split(':')[1];
  if(target.indexOf('gallery:') === 0){
    var gp = state.draft.projects.filter(function(x){ return x.id === id; })[0];
    if(gp && value){ gp.gallery = gp.gallery || []; gp.gallery.push(value); gp.example = false; }
    return;
  }
  var p = state.draft.projects.filter(function(x){ return x.id === id; })[0];
  if(p){ p.image = value; if(value) p.example = false; }
}
function compress(file, max, q){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('compress')); }, 'image/jpeg', q);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('load')); };
    img.src = url;
  });
}
function blobToDataUrl(b){ return new Promise(function(res){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.readAsDataURL(b); }); }
function setStatus(kind, text){ state.status = kind ? {kind:kind, text:text} : null; var st = document.getElementById('adm-status'); if(st) st.innerHTML = statusChip(); }

function handleUpload(target, file){
  var video = /^video\//.test(file.type);
  if(video && target.indexOf('gallery:') !== 0){ setStatus('error', 'Vídeos só podem ir na galeria do projeto. Para a capa, use uma imagem.'); return Promise.resolve(); }
  if(video && file.size > 80 * 1024 * 1024){ setStatus('error', 'Vídeo maior que 80 MB. Comprima antes de enviar.'); return Promise.resolve(); }
  if(!video && file.size > 20 * 1024 * 1024){ setStatus('error', 'Imagem maior que 20 MB. Use uma imagem menor.'); return Promise.resolve(); }
  setStatus('dirty', video ? 'Enviando vídeo…' : 'Enviando imagem…');
  var fd = new FormData(); fd.append('file', file);
  return api('POST', '/api/admin/media', fd).then(function(r){
    setImage(target, r.url); setStatus(null); render(); softUpdate(); toast((r.video ? 'Vídeo adicionado' : 'Imagem adicionada') + '. Publique para aplicar no site.');
  }).catch(function(e){
    if(e.status === 401){ state.canEdit = false; setStatus('error', 'Sua sessão expirou. Saia e entre de novo; suas alterações ficam guardadas neste navegador.'); return; }
    setStatus('error', e.message);
  });
}

/* ---------- publicar ---------- */
var publishing = false;
function publish(){
  if(publishing || !dirty()) return;
  publishing = true;
  saveDraftLocal();
  setStatus('dirty', 'Publicando…');
  api('PUT', '/api/admin/portfolio', state.draft).then(function(saved){
    publishing = false;
    DATA = normalize(saved);
    state.draft = clone(DATA);
    state.recovered = false;
    ss(function(s){ s.removeItem(DRAFT_KEY); });
    setStatus('ok', 'Publicado');
    render();
    setTimeout(function(){ if(state.status && state.status.kind === 'ok'){ setStatus(null); } }, 3000);
  }).catch(function(e){
    publishing = false;
    if(e.status === 401){ state.canEdit = false; state.adminOpen = false; state.loginOpen = true; state.loginError = 'Sua sessão expirou. Entre de novo para publicar; suas alterações ficaram guardadas.'; render(); return; }
    setStatus('error', e.message);
  });
}

app.addEventListener('submit', function(ev){
  var f = ev.target;
  if(f.id === 'login-form'){
    ev.preventDefault();
    var email = document.getElementById('login-email').value, pass = document.getElementById('login-pass').value;
    state.loginEmail = email;
    api('POST', '/api/auth/login', { email: email, password: pass }).then(function(r){
      state.canEdit = true; state.me = r.email; state.loginOpen = false; state.loginError = '';
      return api('GET', '/api/admin/portfolio').then(function(d){ DATA = normalize(d); });
    }).then(function(){ openAdmin(); }).catch(function(e){
      state.loginError = e.message; render(); var p = document.getElementById('login-pass'); if(p){ p.value = ''; p.focus(); }
    });
  }
  if(f.id === 'pass-form'){
    ev.preventDefault();
    api('PUT', '/api/auth/password', { currentPassword: document.getElementById('pw-current').value, newPassword: document.getElementById('pw-new').value })
      .then(function(){ f.reset(); toast('Senha trocada'); })
      .catch(function(e){ setStatus('error', e.message); });
  }
});

/* ---------- início ---------- */
// versão estática: só a página pública, com o conteúdo em data/portfolio.json
function boot(){
  fetch('data/portfolio.json').then(function(r){ if(!r.ok) throw new Error('load'); return r.json(); }).then(function(d){
    DATA = normalize(d);
    state.loading = false;
    document.title = DATA.profile.name ? DATA.profile.name + ' · Portfólio' : 'Portfólio';
    render();
    if(location.hash){ var tgt = document.getElementById(location.hash.slice(1)); if(tgt) tgt.scrollIntoView(); }
  }).catch(function(){ state.loading = false; state.loadError = true; render(); });
}
render();
boot();
})();
</script>
